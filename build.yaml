# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: seeeduino_xiao_ble
    shield: mona2_r
    snippet: trackball-peripheral
    artifact-name: mona2_r_trackball_peripheral
  - board: seeeduino_xiao_ble
    shield: mona2_r
    snippet: "studio-rpc-usb-uart trackball-central"
    artifact-name: mona2_r_trackball_central
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

  - board: seeeduino_xiao_ble
    shield: mona2_l
    snippet: non-trackball-peripheral
    artifact-name: mona2_l_non_trackball_peripheral
#  --- dongle ---
  - board: raytac_mdbt50q_rx
    shield: mona2_dongle
    snippet: "studio-rpc-usb-uart non-trackball-central"
    artifact-name: mona2_dongle_central
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
# --- dongle end ---
  - board: seeeduino_xiao_ble
    shield: settings_reset
  - board: raytac_mdbt50q_rx
    shield: settings_reset